<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Updates — 2026 Field Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Karla:wght@400;500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">

  <header class="updates-hero">
    <span class="kicker" id="kicker">the log —</span>
    <h1 id="pageTitle">Progress updates</h1>
    <p id="pageSub">Every update I've posted, newest first.</p>
  </header>

  <div class="filter-row" id="filterRow"></div>

  <main id="log" class="log"><p class="log-empty">Loading…</p></main>

  <a class="back-link" href="index.html">← back to goals</a>

</div>

<script>
const CATEGORIES = [
  { id:"social",  accent:"var(--rose)" },
  { id:"health",  accent:"var(--sage)" },
  { id:"career",  accent:"var(--clay)" },
  { id:"finance", accent:"var(--peri)" },
];

function accentFor(goal, goalsById){
  const g = goalsById[goal];
  if(!g) return "var(--gold)";
  const cat = CATEGORIES.find(c => c.id === g.cat);
  return cat ? cat.accent : "var(--gold)";
}

function formatDate(iso){
  const d = new Date(iso + "T00:00:00");
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

function renderLog(updates, goalsById, activeGoalId){
  const logEl = document.getElementById('log');
  const filtered = activeGoalId
    ? updates.filter(u => u.goal === activeGoalId)
    : updates;

  const sorted = filtered.slice().sort((a, b) => b.date.localeCompare(a.date));

  if(!sorted.length){
    logEl.innerHTML = `<p class="log-empty">No updates posted here yet.</p>`;
    return;
  }

  logEl.innerHTML = sorted.map(u => {
    const goal = goalsById[u.goal];
    const accent = accentFor(u.goal, goalsById);
    return `
      <div class="log-entry">
        <div class="log-date">${formatDate(u.date)}</div>
        <div class="log-body">
          ${!activeGoalId && goal ? `<span class="log-goal" style="color:${accent}">${goal.title}</span><br>` : ""}
          <span class="log-text">${u.text}</span>
        </div>
      </div>
    `;
  }).join("");
}

function renderFilters(goals, activeGoalId){
  const row = document.getElementById('filterRow');
  const allTab = `<a class="tab" href="updates.html" style="${!activeGoalId ? 'border-color:var(--gold); color:var(--gold);' : ''}">All updates</a>`;
  const goalTabs = goals.map(g => {
    const isActive = g.id === activeGoalId;
    return `<a class="tab" href="updates.html?goal=${encodeURIComponent(g.id)}" style="${isActive ? 'border-color:var(--gold); color:var(--gold);' : ''}">${g.title}</a>`;
  }).join("");
  row.innerHTML = allTab + goalTabs;
}

const params = new URLSearchParams(window.location.search);
const activeGoalId = params.get('goal');

Promise.all([
  fetch('goals.json').then(r => r.json()),
  fetch('updates.json').then(r => r.json())
]).then(([goals, updates]) => {
  const goalsById = {};
  goals.forEach(g => goalsById[g.id] = g);

  if(activeGoalId && goalsById[activeGoalId]){
    document.getElementById('pageTitle').textContent = goalsById[activeGoalId].title;
    document.getElementById('pageSub').textContent = "Updates on this goal, newest first.";
  }

  renderFilters(goals, activeGoalId);
  renderLog(updates, goalsById, activeGoalId);
}).catch(err => {
  document.getElementById('log').innerHTML =
    '<p class="log-empty">Couldn\'t load the data files — if you\'re previewing this locally, that\'s expected. It will work once the site is live on GitHub Pages.</p>';
  console.error(err);
});
</script>

</body>
</html>
