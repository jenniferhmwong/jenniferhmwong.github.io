<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Updates — 2026 Scrapbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Karla:wght@400;500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">

  <header class="updates-hero">
    <span class="kicker" id="kicker">the log —</span>
    <h1 id="pageTitle">Progress updates</h1>
    <p id="pageSub">Loading…</p>
    <a class="back-link" href="index.html">← back to goals</a>
  </header>

  <main id="log" class="log"><p class="log-empty">Loading…</p></main>

</div>

<script>
const CATEGORIES = [
  { id:"social",  accent:"var(--rose)" },
  { id:"health",  accent:"var(--sage)" },
  { id:"career",  accent:"var(--clay)" },
  { id:"finance", accent:"var(--peri)" },
];

function accentForCat(catId){
  const cat = CATEGORIES.find(c => c.id === catId);
  return cat ? cat.accent : "var(--gold)";
}

function formatDate(iso){
  const d = new Date(iso + "T00:00:00");
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

function renderLog(entries, accent){
  const logEl = document.getElementById('log');

  if(!entries.length){
    logEl.innerHTML = `<p class="log-empty">No updates posted for this goal yet.</p>`;
    return;
  }

  const sorted = entries.slice().sort((a, b) => b.date.localeCompare(a.date));

  logEl.innerHTML = sorted.map(u => `
    <div class="log-entry" style="--accent:${accent}">
      <div class="log-date">${formatDate(u.date)}</div>
      <div class="log-body">
        <span class="log-text">${u.text}</span>
      </div>
    </div>
  `).join("");
}

const params = new URLSearchParams(window.location.search);
const goalId = params.get('goal');

Promise.all([
  fetch('goals.json').then(r => r.json()),
  fetch('updates.json').then(r => r.json())
]).then(([goals, updates]) => {
  if(!goalId){
    document.getElementById('pageTitle').textContent = "No goal selected";
    document.getElementById('pageSub').textContent = "Head back to the goals page and click \u201cProgress updates\u201d on a specific goal.";
    document.getElementById('log').innerHTML = "";
    return;
  }

  const goal = goals.find(g => g.id === goalId);
  const accent = goal ? accentForCat(goal.cat) : "var(--gold)";

  document.getElementById('pageTitle').textContent = goal ? goal.title : "Unknown goal";
  document.getElementById('pageTitle').style.color = accent;
  document.getElementById('pageSub').textContent = "Every update on this goal, newest first.";

  const entries = updates.filter(u => u.goal === goalId);
  renderLog(entries, accent);
}).catch(err => {
  document.getElementById('log').innerHTML =
    '<p class="log-empty">Couldn\'t load the data files — if you\'re previewing this locally, that\'s expected. It will work once the site is live on GitHub Pages.</p>';
  console.error(err);
});
</script>

</body>
</html>
